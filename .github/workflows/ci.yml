  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4: Notificación de resultado del pipeline
  #
  # Comenta el resultado del pipeline directamente en el PR de GitHub.
  # needs: [lint, unit-and-api-tests] — e2e-tests excluido hasta activarlo.
  # ─────────────────────────────────────────────────────────────────────────
  notify:
    name: Notificar resultado del pipeline
    runs-on: ubuntu-latest
    needs: [lint, unit-and-api-tests]
    if: always()
    steps:
      - name: Comentar resultado en el PR
        uses: actions/github-script@v7
        with:
          script: |
            const lintResult = '${{ needs.lint.result }}';
            const testResult = '${{ needs.unit-and-api-tests.result }}';
            const overall = (lintResult === 'success' && testResult === 'success') ? 'success' : 'failure';
            const emoji = overall === 'success' ? '✅' : '❌';

            const body = [
              `## ${emoji} NovaMarket QA Pipeline — ${overall.toUpperCase()}`,
              '',
              '| Job | Estado |',
              '|-----|--------|',
              `| Lint & Type Check | ${lintResult} |`,
              `| Unit & API Tests | ${testResult} |`,
              `| E2E Tests | ⏸️ deshabilitado (frontend + db:seed:test pendientes) |`,
              '',
              '_Los reportes de cobertura están disponibles como artefactos en este workflow run._'
            ].join('\n');

            if (context.payload.pull_request) {
              github.rest.issues.createComment({
                issue_number: context.payload.pull_request.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
