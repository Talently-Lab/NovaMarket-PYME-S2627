<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Fondo negro -->
  <rect width="32" height="32" rx="6" fill="#050506"/>
  <!-- Letra N dibujada con paths — trazo izquierdo, diagonal, trazo derecho -->
  <!-- Trazo vertical izquierdo -->
  <rect x="6" y="7" width="4.5" height="18" fill="#D2EE42"/>
  <!-- Trazo vertical derecho -->
  <rect x="21.5" y="7" width="4.5" height="18" fill="#D2EE42"/>
  <!-- Diagonal de arriba-izquierda a abajo-derecha -->
  <polygon points="10.5,7 15.5,7 26,25 21,25" fill="#D2EE42"/>
</svg>
